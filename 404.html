<script>
  // Media moved to Cloudflare R2 (media.ladoger.art). Send old links like
  // /images/abc123.jpg, /v1/... and /refs/... to the same path there.
  (function () {
    var p = location.pathname;
    if (/^\/(images|refs|v1)\/.+\.(jpe?g|png|gif|webp|mp4|mov|webm|mp3)$/i.test(p)) {
      location.replace('https://media.ladoger.art' + p + location.search + location.hash);
    }
  })();
</script>
